<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreatedForYou</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-primary navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold fs-1" href="#">🖌️CreatedForYou</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#menu"
              aria-controls="menu" aria-expanded="false" aria-label="Menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#catalogo">Catalogo</a></li>
          <li class="nav-item"><a class="nav-link" href="#criar">Monte o Seu</a></li>
        </ul>
      </div>
    </div>
  </nav>
  

  <main class="container my-5">

    <h2 class="text-center mb-4 fw-bold">Nossas Personalizações</h2>
     
    <section id="catalogo" class="row g-3">
    </section>

    <hr class="my-5">
     
    <section id="criar" class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <h2 class="text-center mb-4 fw-bold">Monte o Seu</h2>
        <form>
          <div class="mb-3">
            <label class="form-label fw-bold">Seu nome</label>
            <input type="text" class="form-control" placeholder="Nome completo">
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">E-mail</label>
            <input type="email" class="form-control" placeholder="voce@email.com">
          </div>



          <div class="mb-4">
        <label class="form-label fw-bold">
          Imagem da personalização
        </label>

        <div class="border rounded p-4 text-center">
          <p class="mb-3">
            Adicione a imagem que deseja colocar no objeto
          </p>

          <button type="button" class="btn btn-info">
            Escolher imagem
          </button>
        </div>
      </div>
       



      <div class="mb-4">
        <label class="form-label fw-bold">
          Escolha o objeto que deseja personalizar:
        </label>

        <div class="row g-3">

          <div class="col-6 col-md-4 col-lg-3">
            <button type="button" class="btn btn-outline-info w-100 p-2">
              <img src="images/caneca.png" class="img-fluid" alt="Caneca"
              >
              <span class="d-block mt-2">Caneca</span>
            </button>
          </div>

          <div class="col-6 col-md-4 col-lg-3">
            <button type="button" class="btn btn-outline-info w-100 p-2">
              <img src="images/ecobag.png" class="img-fluid" alt="EcoBag"
              >
              <span class="d-block mt-2">EcoBag</span>
            </button>
          </div>

          <div class="col-6 col-md-4 col-lg-3">
            <button type="button" class="btn btn-outline-info w-100 p-2">
              <img src="images/garrafa.png" class="img-fluid" alt="garrafa"
              >
              <span class="d-block mt-2">Garrafa</span>
            </button>
          </div>

          <div class="col-6 col-md-4 col-lg-3">
            <button type="button" class="btn btn-outline-info w-100 p-2">
              <img src="images/almofada.jpg" class="img-fluid" alt="almofada"
              >
              <span class="d-block mt-2">Almofada</span>
            </button>
          </div>
          

        </div>
      </div>




          <div class="mb-3">
            <label class="form-label fw-bold">Mensagem</label>
            <textarea class="form-control" rows="4" placeholder="">Detalhe seu pedido personalizado</textarea>
          </div>
          <button type="button" class="btn btn-info w-100">Pedir</button>
        </form>
      </div>
    </section>

  </main>

  
    <div class="modal fade" id="modalProduto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-info text-white">
          <h5 class="modal-title" id="modalNome"></h5>
          <button type="button" class="btn-close btn-close-white"
                  data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted mb-1" id="modalCategoria"></p>
          <p class="fs-4 fw-bold text-success mb-3" id="modalPreco"></p>
          <p id="modalDescricao"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary"
                  data-bs-dismiss="modal">Fechar</button>
          <button type="button" class="btn btn-info">Pedir Agora</button>
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js" defer></script>
</body>
</html>
